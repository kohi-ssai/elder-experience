<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시각체험">
<meta name="theme-color" content="#14181C">
<title>시각 체험 · 어르신 안질환 카메라 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/vision-fx.js"></script>
<style>
  html,body{ overflow:hidden; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- STAGE (camera) ---------- */
  #stage{ position:relative; flex:1; min-height:0; background:#000; overflow:hidden; touch-action:none; }
  #stage video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  #videoNormal{ z-index:1; }
  #simWrap{ position:absolute; inset:0; z-index:2; overflow:hidden; clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
  #videoSim{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #videoGhost{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; mix-blend-mode:screen; }
  /* 백내장 빛번짐: 밝은 부분만 남겨(contrast) 크게 번지게(blur) 한 영상을 screen 합성 */
  #videoBloom{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; mix-blend-mode:screen; pointer-events:none; }
  #cbCanvas{ position:absolute; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  #loupeCanvas{ position:absolute; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  #amdCanvas{ position:absolute; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  /* 굴절장애(난시)·노안의 겹쳐 번지는 상 — 복시와 달리 밝게 더하지 않고 그대로 겹친다 */
  #videoGhost2{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; pointer-events:none; }

  .overlay{ position:absolute; inset:0; pointer-events:none; }
  #ovVignette{ background:transparent; opacity:0; transition:opacity .25s; }
  #ovHaze{ background:rgba(230,222,200,0.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); opacity:0; transition:opacity .25s,background .25s; }
  #ovGlare{ background:radial-gradient(circle at 50% 42%, rgba(255,252,235,.9), rgba(255,252,235,0) 62%); opacity:0; transition:opacity .25s; mix-blend-mode:screen; }
  #ovCentral{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:46%; aspect-ratio:1/1; border-radius:50%; opacity:0;
    transition:opacity .25s, filter .25s, width .25s, background .25s;
  }
  #ovHemi{ position:absolute; top:0; bottom:0; width:50%; opacity:0; background:#050505; transition:opacity .25s, width .25s; }
  .floater{ position:absolute; opacity:0; transition:opacity .25s; animation:drift 10s ease-in-out infinite; pointer-events:none; }
  .floater svg{ width:100%; height:100%; display:block; overflow:visible; }
  .floater.fly{
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(18,16,12,0.7), rgba(18,16,12,0.32) 65%, rgba(18,16,12,0) 100%);
    filter:blur(.4px);
  }
  @keyframes drift{ 0%,100%{transform:translate(0,0) rotate(0deg)} 33%{transform:translate(5px,-4px) rotate(2deg)} 66%{transform:translate(-3px,3px) rotate(-2deg)} }

  /* 당뇨망막병증 단계별 반점 */
  .dspot{
    position:absolute; border-radius:38% 62% 55% 45%/48% 42% 58% 52%;
    background:rgba(14,12,10,0.5); filter:blur(3px); opacity:0; transition:opacity .3s, width .3s, height .3s;
  }
  .dspot.red{ background:rgba(122,24,18,0.55); }

  /* 녹내장 - 주변시야 전체가 어두워지고 중심만 또렷하게 유지 (코쪽/상하부 비대칭 강조 추가) */
  #ovGlaucoma{
    background:
      radial-gradient(circle at 50% 50%, transparent 34%, rgba(2,2,2,var(--gRing,0)) 66%),
      radial-gradient(ellipse 46% 34% at 6% 40%, rgba(2,2,2,var(--g1,0)) 0%, rgba(2,2,2,0) 76%),
      radial-gradient(ellipse 50% 30% at 52% 2%, rgba(2,2,2,var(--g2,0)) 0%, rgba(2,2,2,0) 78%),
      radial-gradient(ellipse 44% 32% at 60% 100%, rgba(2,2,2,var(--g3,0)) 0%, rgba(2,2,2,0) 78%);
    opacity:0; transition:opacity .25s;
  }

  #divider{ position:absolute; top:0; bottom:0; left:50%; width:0; z-index:5; touch-action:none; }
  #divider .line{ position:absolute; top:0; bottom:0; left:-1px; width:2px; background:rgba(238,234,226,0.85); box-shadow:0 0 12px rgba(0,0,0,.5); }
  #divider .handle{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; background:var(--bg-panel); border:2px solid var(--amber);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #divider .handle svg{ width:22px; height:22px; }
  .side-tag{
    position:absolute; bottom:14px; z-index:4; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;
    letter-spacing:.06em; color:rgba(238,234,226,.9); background:rgba(20,24,28,.55); padding:4px 9px; border-radius:20px;
    border:1px solid rgba(238,234,226,.18); pointer-events:none;
  }
  #tagLeft{ left:14px; } #tagRight{ right:14px; }

  #homeBtn{
    position:absolute; z-index:11; top:calc(var(--safe-top) + 8px); left:10px;
    height:42px; padding:0 14px 0 10px; gap:4px; border-radius:21px; background:rgba(20,24,28,.82); border:1.5px solid rgba(238,234,226,.55);
    display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:15px; font-weight:700; text-decoration:none;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #homeBtn .arr{ font-size:20px; line-height:1; }
  #loupeToggle{
    position:absolute; z-index:11; bottom:60px; right:14px; display:none;
    align-items:center; gap:6px; background:rgba(20,24,28,.72); border:1px solid rgba(238,234,226,.25);
    color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:12.5px;
    padding:9px 14px; border-radius:20px;
  }
  /* 노안 돋보기 모드: 좌우 비교 없이 화면 전체를 흐리게 보여주고 원 안만 선명하게 */
  /* 반맹도 좌우 비교 없이 전체 화면으로 보여준다(왼쪽이 안 보임을 고르면 왼쪽 절반이 가려져야 하므로) */
  #stage.loupe-mode #simWrap, #stage.nosplit #simWrap{ clip-path:none !important; }
  #stage.loupe-mode #divider, #stage.nosplit #divider,
  #stage.loupe-mode .side-tag, #stage.nosplit .side-tag{ display:none; }
  #loupeToggle.on{ background:rgba(217,164,65,.92); color:#1B1300; border-color:var(--amber); }

  #permOverlay{
    position:absolute; inset:0; z-index:20; background:var(--bg-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; gap:14px;
  }
  #permOverlay h2{ margin:0; font-size:19px; }
  #permOverlay p{ margin:0; color:var(--ink-dim); font-size:14px; line-height:1.6; max-width:320px; }
  #permOverlay button{
    margin-top:8px; background:var(--amber); color:#1B1300; border:none; font-family:'Noto Sans KR',sans-serif;
    font-weight:700; font-size:15px; padding:12px 26px; border-radius:30px; cursor:pointer;
  }
  #permOverlay .err{ color:var(--brick); font-size:12.5px; margin-top:4px; }

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:10; padding:calc(var(--safe-top) + 14px) 14px 40px 128px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent); pointer-events:none;
  }
  #condName{ display:flex; align-items:center; gap:8px; min-width:0; }
  #condName span.n{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #recDot{ flex-shrink:0; }
  #recDot{ width:8px; height:8px; border-radius:50%; background:var(--brick); box-shadow:0 0 8px var(--brick); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  #condName span.n{ font-weight:700; font-size:15px; }
  #acuityBadge{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--bg-deep); background:var(--amber); padding:3px 8px; border-radius:5px; white-space:nowrap; }

  #panel{ background:var(--bg-panel); border-top:1px solid var(--line); padding-bottom:var(--safe-bottom); flex-shrink:0; }
  .grouplbl{ padding:10px 14px 0; font-size:10.5px; font-weight:700; letter-spacing:.08em; color:var(--ink-faint); }
  #groupTabs{ display:flex; gap:8px; padding:8px 14px 2px; }
  .gtab{
    flex:1; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:11px; color:var(--ink-dim);
    font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:12.5px; padding:9px 8px; cursor:pointer;
  }
  .gtab .cnt{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10.5px; color:var(--ink-faint); margin-left:3px; }
  .gtab.active{ background:rgba(217,164,65,0.14); border-color:rgba(217,164,65,.5); color:var(--amber); }
  .gtab.active .cnt{ color:var(--amber); opacity:.75; }
  #chips{ display:flex; gap:8px; padding:8px 14px 4px; overflow-x:auto; scrollbar-width:none; }
  #chips2{ display:flex; gap:8px; padding:8px 14px 4px; overflow-x:auto; scrollbar-width:none; }
  #chips::-webkit-scrollbar,#chips2::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px 12px;
    border-radius:12px; border:1px solid var(--line); background:var(--bg-panel-2); cursor:pointer; user-select:none;
  }
  .chip .t{ font-size:13px; font-weight:700; }
  .chip .a{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-faint); }
  .chip.active{ border-color:var(--amber); background:rgba(217,164,65,0.12); }
  .chip.active .t{ color:var(--amber); }

  #subChips{ display:none; gap:8px; padding:0 14px 8px; overflow-x:auto; }
  #subChips.show{ display:flex; }
  .subchip{ flex:0 0 auto; padding:6px 12px; border-radius:20px; font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .subchip.active{ border-color:var(--amber); color:var(--amber); }

  #stageRow{ display:none; gap:8px; padding:4px 14px 2px; }
  #stageRow.show{ display:flex; }
  .stagebtn{
    flex:1; padding:9px 4px; border-radius:10px; font-size:12.5px; font-weight:700; text-align:center;
    border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .stagebtn.active{ border-color:var(--brick); background:rgba(176,87,74,.16); color:#E2A79E; }

  #presbyRow{ display:none; gap:8px; padding:4px 14px 2px; }
  #presbyRow.show{ display:flex; }
  #severityRow{ padding:10px 16px 4px; }
  #severityRow.hide{ display:none; }
  #severityRow .lbl{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  #severityRow .lbl .lt{ font-size:12.5px; color:var(--ink-dim); }
  #severityRow .lbl .lv{ font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--amber); }
  input[type=range]{ -webkit-appearance:none; width:100%; height:26px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; margin-top:-8px; border-radius:50%; background:var(--amber); border:3px solid var(--bg-panel); box-shadow:0 0 0 1px var(--amber); }
  input[type=range]::-moz-range-track{ height:4px; background:var(--line); border-radius:2px; }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:var(--amber); border:3px solid var(--bg-panel); }

  #panelDrag{
    display:flex; align-items:center; justify-content:center; padding:18px 0 16px; touch-action:none; cursor:grab;
  }
  #panelDrag .bar{ width:44px; height:5px; border-radius:3px; background:var(--line); }

  #tipsToggle{
    width:calc(100% - 20px); margin:2px 10px 0; background:rgba(217,164,65,0.1); border:1px solid rgba(217,164,65,.35); border-radius:12px;
    color:var(--amber); font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:13.5px; padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; cursor:pointer; animation:tipsPulse 2.2s ease-in-out infinite;
  }
  #tipsToggle.open{ animation:none; background:rgba(217,164,65,0.16); }
  @keyframes tipsPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,164,65,.35);} 50%{ box-shadow:0 0 0 6px rgba(217,164,65,0);} }
  #tipsToggle .car{ transition:transform .2s; font-size:15px; }
  #tipsToggle.open .car{ transform:rotate(180deg); }
  #tipsBody{ max-height:0; overflow:hidden; transition:max-height .28s ease; padding:0 16px; }
  #tipsBody.open{ max-height:280px; padding-bottom:14px; overflow-y:auto; margin-top:8px; }
  #tipsBody .desc{ font-size:13.5px; line-height:1.65; color:var(--ink); margin:6px 0 12px; }
  #tipsBody .tiplbl{ font-size:11.5px; color:var(--amber); font-weight:700; letter-spacing:.03em; margin-bottom:6px; }
  #tipsBody ul{ margin:0; padding-left:18px; }
  #tipsBody li{ font-size:13px; line-height:1.7; color:var(--ink-dim); margin-bottom:4px; }

  #stageHint{
    width:calc(100% - 20px); margin:10px 10px 2px; text-align:center; font-size:12.5px; font-weight:700;
    line-height:1.5; color:var(--sage);
    background:rgba(122,148,113,0.12); border:1px solid rgba(122,148,113,.45); border-radius:12px;
    padding:9px 14px;
  }
  #panel.compact #stageHint{ display:none; }

  /* 10번: 컴팩트 모드 - 손잡이를 탭하면 선택 UI를 숨기고 카메라 화면을 크게 */
  #panelDrag{ position:relative; }
  #panelDrag .tapHint{ position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--ink-faint); }
  #compactInfo{ display:none; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-dim); padding:2px 0 10px; }
  #panel.compact #groupTabs,
  #panel.compact #chips,
  #panel.compact #chips2,
  #panel.compact #subChips,
  #panel.compact #stageRow,
  #panel.compact #presbyRow,
  #panel.compact #severityRow,
  #panel.compact #tipsToggle,
  #panel.compact #tipsBody{ display:none; }
  #panel.compact #compactInfo{ display:block; }


</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <video id="videoNormal" autoplay playsinline muted></video>

    <div id="simWrap">
      <video id="videoSim" autoplay playsinline muted></video>
      <canvas id="cbCanvas"></canvas>
      <canvas id="loupeCanvas"></canvas>
      <canvas id="amdCanvas"></canvas>
      <video id="videoGhost" autoplay playsinline muted></video>
      <video id="videoGhost2" autoplay playsinline muted></video>
      <video id="videoBloom" autoplay playsinline muted></video>
      <div class="overlay" id="ovHaze"></div>
      <div class="overlay" id="ovGlare"></div>
      <div class="overlay" id="ovVignette"></div>
      <div class="overlay" id="ovHemi"></div>
      <div class="overlay" id="ovGlaucoma"></div>
      <div class="overlay"><div id="ovCentral"></div></div>
      <div class="overlay" id="ovFloaters"></div>
      <div class="overlay" id="ovDiabetic"></div>
    </div>

    <a id="homeBtn" href="index.html"><span class="arr">&#8592;</span>처음으로</a>
    <div class="side-tag" id="tagLeft">1 &middot; 정상 시야</div>
    <div class="side-tag" id="tagRight">2 &middot; 체험 중</div>
    <button id="loupeToggle">&#128269; 돋보기로 보기</button>

    <div id="divider">
      <div class="line"></div>
      <div class="handle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="2" stroke-linecap="round">
          <path d="M4 12h4M16 12h4M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z"/>
        </svg>
      </div>
    </div>

    <div id="topbar">
      <div id="condName"><span id="recDot"></span><span class="n" id="condLabel">백내장</span></div>
      <span class="mono" id="acuityBadge">20/200</span>
    </div>

    <div id="permOverlay">
      <h2>카메라로 체험해보세요</h2>
      <p>이 앱은 카메라 화면에 실시간으로 필터를 입혀<br>어르신이 겪는 시야를 그대로 재현합니다.<br>카메라 접근을 허용해주세요.</p>
      <button id="btnStart">카메라 시작하기</button>
      <p class="err" id="permErr"></p>
    </div>
  </div>

  <div id="panel">
    <div id="panelDrag"><div class="bar"></div><span class="tapHint">위·중간·아래로 밀어보세요</span></div>
    <div id="compactInfo"></div>
    <div id="stageHint">&#9995; 손잡이 좌우 드래그 &middot; 1(정상)&middot;2(체험) 비교</div>
    <div id="groupTabs">
      <button class="gtab active" data-g="aging">노화성 안질환 <span class="cnt">8종</span></button>
      <button class="gtab" data-g="general">일반 시각장애 <span class="cnt">7종</span></button>
    </div>
    <div id="chips"></div>
    <div id="chips2" style="display:none;"></div>
    <div id="subChips"></div>

    <div id="stageRow">
      <button class="stagebtn" data-stage="1">&#9679; 초기</button>
      <button class="stagebtn" data-stage="2">&#9679;&#9679; 중기</button>
      <button class="stagebtn" data-stage="3">&#9679;&#9679;&#9679; 말기</button>
    </div>

    <div id="presbyRow">
      <button class="stagebtn" data-near="1">&#128214; 가까운 글씨 보기</button>
      <button class="stagebtn" data-near="0">&#127956; 먼 거리 보기</button>
    </div>

    <div id="severityRow">
      <div class="lbl"><span class="lt" id="sevLabel">체험 강도</span><span class="lv mono" id="sevValue">55%</span></div>
      <input type="range" id="severity" min="0" max="100" value="55">
    </div>

    <button id="tipsToggle"><span id="tipsToggleLabel">&#128161; 어르신은 이렇게 어려워요</span><span class="car">&#9662;</span></button>
    <div id="tipsBody">
      <div class="desc" id="tipsDesc"></div>
      <div class="tiplbl">사회복무요원 응대 팁</div>
      <ul id="tipsList"></ul>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // iOS Safari는 viewport의 user-scalable=no를 접근성 이유로 무시하는 경우가 많아,
  // 노안 핀치 제스처 중 카메라 화면이 아니라 페이지 전체가 확대/축소되는 문제가 생길 수 있음.
  // 네이티브 제스처(gesturestart 등)와 두 손가락 touchmove를 직접 막아 페이지 자체 줌을 차단.
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>{
    document.addEventListener(ev, e=> e.preventDefault());
  });
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });

  // ---------- 노화성 안질환 8종 ----------
  const AGING = [
    { id:'cataract', name:'백내장', acuity:'20/200', group:'aging',
      desc:'수정체가 뿌옇게 흐려져 안개가 낀 것처럼 보이고, 밝은 빛은 번지듯 퍼져 보입니다. 전체적으로 색이 누렇게 바래 보이기도 해요.',
      tips:['조명을 밝게 하되 창가 역광·직사광은 피해주세요','글씨는 크고 굵게, 대비가 뚜렷한 자료를 준비하세요','서류 서명란은 손으로 짚어 안내해주세요'],
      apply(t){ const e=Math.pow(t,1.5);

        // 대신 백내장 특유의 누런 색조(sepia)와 밝은 빛이 번지는 느낌(glare)을 강조한다.

        return { filter:`blur(${1+4*e}px) contrast(${100-30*e}%) sepia(${35+55*t}%) saturate(${115+45*t}%) hue-rotate(${-6*t}deg) brightness(${102+6*t}%)`,

  const PROTANOPIA_3 = [
    0.152,1.053,-0.205,
    0.115,0.786,0.099,
    -0.004,-0.048,1.052
  ];
  let cbRunning = false;
  let cbLoopId = 0;
  let cbLastT = 0;
  function cbInterpMatrix(t){
    return IDENTITY_3.map((v,i)=> v + (PROTANOPIA_3[i]-v)*t);
  }
  function cbDrawFrame(id){
    if(!cbRunning || id !== cbLoopId) return;
    const srcVideo = videoNormal;
    if(srcVideo.videoWidth > 0){
      const rect = document.getElementById('stage').getBoundingClientRect();
      const targetW = 300, targetH = Math.round(targetW * (rect.height/rect.width || 1.8));
      if(cbCanvas.width !== targetW || cbCanvas.height !== targetH){
        cbCanvas.width = targetW; cbCanvas.height = targetH;
      }
      const vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
      const scale = Math.max(targetW/vw, targetH/vh);
      const sw = targetW/scale, sh = targetH/scale;
      const sx = (vw-sw)/2, sy = (vh-sh)/2;
      cbCtx.drawImage(srcVideo, sx, sy, sw, sh, 0, 0, targetW, targetH);
      const m = cbInterpMatrix(cbLastT);
      const imgData = cbCtx.getImageData(0, 0, targetW, targetH);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        const r=d[i], g=d[i+1], b=d[i+2];
        d[i]   = Math.min(255, Math.max(0, m[0]*r + m[1]*g + m[2]*b));
        d[i+1] = Math.min(255, Math.max(0, m[3]*r + m[4]*g + m[5]*b));
        d[i+2] = Math.min(255, Math.max(0, m[6]*r + m[7]*g + m[8]*b));
      }
      cbCtx.putImageData(imgData, 0, 0);
    }
    requestAnimationFrame(()=> cbDrawFrame(id));
  }
  function startColorblindCanvas(t){
    cbLastT = t;
    videoSim.style.opacity = '0';
    cbCanvas.style.display = 'block';
    if(!cbRunning){
      cbRunning = true;
      cbLoopId++;
      cbDrawFrame(cbLoopId);
    }
  }
  function stopColorblindCanvas(){
    cbRunning = false;
    cbLoopId++;
    cbCanvas.style.display = 'none';
    videoSim.style.opacity = '1';
  }

  // 1번-보조: 노안 돋보기 모드 - 배경(화면 전체)은 videoSim에 CSS filter blur를 걸어
  // 초점이 안 맞게 보여주고, 이 캔버스에는 손가락으로 누른 자리의 원 안쪽만
  // 선명한 영상을 (돋보기처럼 살짝 확대해서) 그린다. 원 바깥은 투명하게 비워 둔다.
  // iOS Safari는 캔버스 ctx.filter(blur)를 지원하지 않아 캔버스에서 흐림을 만들면
  // 아이폰에서는 화면 전체가 선명하게 보이므로, 흐림은 반드시 CSS filter로 처리한다.
  const LOUPE_MAG = 1.6; // 돋보기 확대 배율
  let loupeRunning = false;
  let loupeLoopId = 0;
  // 돋보기를 켜도 손가락으로 확대·축소해 둔 상태(흐림 정도·확대 배율)를 그대로 유지한다
  function presbyScale(){ return presbyopiaNear ? 1.1 : 1; }
  function loupeDrawFrame(id){
    if(!loupeRunning || id !== loupeLoopId) return;
    const srcVideo = videoNormal;
    if(srcVideo.videoWidth > 0){
      const rect = document.getElementById('stage').getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio||1);
      const targetW = Math.round(rect.width*dpr), targetH = Math.round(rect.height*dpr);
      if(loupeCanvas.width !== targetW || loupeCanvas.height !== targetH){
        loupeCanvas.width = targetW; loupeCanvas.height = targetH;
      }
      const vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
      const scale = Math.max(targetW/vw, targetH/vh);
      const sw = targetW/scale, sh = targetH/scale;
      const sx = (vw-sw)/2, sy = (vh-sh)/2;
      const cx = loupePos.x*targetW, cy = loupePos.y*targetH;
      const radius = Math.min(targetW, targetH)*0.2;

      loupeCtx.clearRect(0, 0, targetW, targetH);
      loupeCtx.save();
      loupeCtx.beginPath();
      loupeCtx.arc(cx, cy, radius, 0, Math.PI*2);
      loupeCtx.clip();
      // 돋보기 중심은 그대로 두고 주변을 LOUPE_MAG배로 키워서 그린다
      loupeCtx.translate(cx, cy);
      loupeCtx.scale(LOUPE_MAG, LOUPE_MAG);
      loupeCtx.translate(-cx, -cy);
      // 그 아래에는 흐린 배경(videoSim)과 똑같이 화면 중심 기준 '가까운 글씨 보기' 확대를 적용해 위치를 맞춘다
      const ps = presbyScale();
      loupeCtx.translate(targetW/2, targetH/2);
      loupeCtx.scale(ps, ps);
      loupeCtx.translate(-targetW/2, -targetH/2);
      loupeCtx.drawImage(srcVideo, sx, sy, sw, sh, 0, 0, targetW, targetH);
      loupeCtx.restore();

      loupeCtx.save();
      loupeCtx.beginPath();
      loupeCtx.arc(cx, cy, radius, 0, Math.PI*2);
      loupeCtx.lineWidth = 4*dpr;
      loupeCtx.strokeStyle = 'rgba(255,255,255,.95)';
      loupeCtx.shadowColor = 'rgba(0,0,0,.45)';
      loupeCtx.shadowBlur = 8*dpr;
      loupeCtx.stroke();
      loupeCtx.restore();
    }
    requestAnimationFrame(()=> loupeDrawFrame(id));
  }
  function startLoupeCanvas(){
    document.getElementById('stage').classList.add('loupe-mode');
    loupeCanvas.style.display = 'block';
    if(!loupeRunning){
      loupeRunning = true;
      loupeLoopId++;
      loupeDrawFrame(loupeLoopId);
    }
  }

  // 황반변성 변시증 - 매 프레임 영상을 버퍼 캔버스에 그린 뒤, 암점 주변 원 안의 픽셀만
  // 물결처럼 옮겨 amdCanvas에 그린다(원 바깥은 투명이라 아래 영상이 그대로 보인다).
  // 영상 위에 SVG 왜곡 필터를 거는 방식은 iOS Safari에서 동작하지 않아 캔버스로 처리한다.
  const amdBuf = document.createElement('canvas');
  const amdBufCtx = amdBuf.getContext('2d', { willReadFrequently:true });
  let amdRunning = false, amdLoopId = 0, amdWarpT = 0;
  function amdDrawFrame(id){
    if(!amdRunning || id !== amdLoopId) return;
    const srcVideo = videoNormal;
    if(srcVideo.videoWidth > 0){
      const rect = document.getElementById('stage').getBoundingClientRect();
      const targetW = 360, targetH = Math.round(targetW * (rect.height/rect.width || 1.8));
      if(amdCanvas.width !== targetW || amdCanvas.height !== targetH){
        amdCanvas.width = targetW; amdCanvas.height = targetH;
        amdBuf.width = targetW; amdBuf.height = targetH;
      }
      const vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
      const scale = Math.max(targetW/vw, targetH/vh);
      const sw = targetW/scale, sh = targetH/scale;
      amdBufCtx.drawImage(srcVideo, (vw-sw)/2, (vh-sh)/2, sw, sh, 0, 0, targetW, targetH);
      // 암점 반지름(화면 폭의 14~28%)보다 넉넉히 큰 원에서 휘게 해야 암점 바깥 고리에서 보인다
      const t = amdWarpT;
      const r = targetW*(0.14+0.14*t)*1.8;
      amdCtx.clearRect(0, 0, targetW, targetH);
      VisionFx.warpPatch(amdBufCtx, amdCtx, amdFocus.x*targetW, amdFocus.y*targetH, r, r*(0.05+0.07*t), performance.now()/1000*0.8);
    }
    requestAnimationFrame(()=> amdDrawFrame(id));
  }
  function startAmdCanvas(){
    amdCanvas.style.display = 'block';
    if(!amdRunning){ amdRunning = true; amdLoopId++; amdDrawFrame(amdLoopId); }
  }
  function stopAmdCanvas(){
    amdRunning = false; amdLoopId++;
    amdCanvas.style.display = 'none';
  }

  function makeChip(c, container){
    const chip = document.createElement('div');
    chip.className='chip'+(c===currentCond?' active':'');
    chip.innerHTML = `<span class="t">${c.name}</span><span class="a mono">${c.acuity}</span>`;
    chip.addEventListener('click', ()=>{
      currentCond = c;
      if(c.sub) currentSub = c.sub[0]; // 이전 조건에서 쓰던 세부 옵션이 남아있지 않도록 첫 옵션으로 초기화
      amdFocus = {x:0.5, y:0.5};
      presbyopiaLoupeOn = false; stopLoupeCanvas(); loupeToggle.classList.remove('on');
      presbyopiaNear = true;
      if(c.id==='accommodative') startFocusLagCycle(); else stopFocusLagCycle();
      [...chipsEl.children, ...chips2El.children].forEach(ch=>ch.classList.remove('active'));
      chip.classList.add('active');
      buildSubChips();
      buildStageRow();
      render();
    });
    container.appendChild(chip);
  }
  // 시각 체험은 첫 화면에서 '노화'와 '일반' 두 개로 나눠 들어온다(vision.html?g=aging / ?g=general).
  // 들어온 쪽의 질환만 보여주고, 페이지 안에서 다른 쪽으로 넘어가는 탭은 두지 않는다.
  const PAGE_GROUP = new URLSearchParams(location.search).get('g')==='general' ? 'general' : 'aging';

  function buildSubChips(){
    subChipsEl.innerHTML='';

  const presbyRow = document.getElementById('presbyRow');
  const severityRow = document.getElementById('severityRow');
  function buildStageRow(){
    // 노안만 초기·중기·말기 대신 '가까운 글씨 보기 / 먼 거리 보기' 두 버튼을 보여준다
    const isPresby = currentCond.id==='presbyopia';
    stageRow.classList.toggle('show', !isPresby);
    severityRow.classList.toggle('hide', isPresby);
    presbyRow.classList.toggle('show', isPresby);
    [...presbyRow.children].forEach(b=> b.classList.toggle('active', (b.dataset.near==='1')===presbyopiaNear));
  }
  [...presbyRow.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      presbyopiaNear = btn.dataset.near==='1';
      buildStageRow();
      render();
    });
  });
  buildStageRow();
  [...stageRow.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const stage = +btn.dataset.stage;
      severity = stage===1?22 : stage===2?58 : 92;
      sevInput.value = severity;
      [...stageRow.children].forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  function sevText(v){ if(v<34) return '초기'; if(v<67) return '중기'; return '말기'; }
  sevInput.addEventListener('input', e=>{
    severity = +e.target.value;
    [...stageRow.children].forEach(b=>b.classList.remove('active'));
    render();
  });

  function render(){
    condLabel.textContent = currentCond.sub ? `${currentCond.name} · ${currentCond.subLabel[currentSub]}` : currentCond.name;
    acuityBadge.textContent = currentCond.acuity;
    sevLabel.textContent = `체험 강도 · ${sevText(severity)}`;
    sevValue.textContent = severity+'%';

    const t = severity/100;
    const res = currentCond.apply(t, currentSub) || {};

    // 노안은 돋보기를 켜도 '가까운 글씨 보기'의 흐림·확대를 그대로 두고, 돋보기 원 안만 선명하게 겹쳐 그린다
    videoSim.style.filter = res.filter || 'none';

    // 반맹은 좌우 비교 없이 전체 화면으로 — 비교 화면(오른쪽 절반)만 보여주면 '왼쪽이 안 보임'을
    // 골랐을 때 가려지는 왼쪽 절반이 잘려서 아무 변화가 없어 보였다
    document.getElementById('stage').classList.toggle('nosplit', currentCond.id==='hemianopia');
    videoSim.style.transformOrigin = 'center center';
    videoSim.style.transform = currentCond.id==='presbyopia' ? `scale(${presbyScale()})` : 'none';

    // 1번-보조: 노안 돋보기 토글 버튼은 노안 항목에서만 보인다
    loupeToggle.style.display = currentCond.id==='presbyopia' ? 'flex' : 'none';

    // vignette / tunnel
    const vig = res.vignette||0;
    ovVignette.style.opacity = vig>0 ? 1 : 0;
    if(vig>0){
      const inner = res.vignetteSoft ? (50 - vig*46) : (46 - vig*40);
      const softness = res.vignetteSoft ? 22 : 10;
      ovVignette.style.background = `radial-gradient(circle at 50% 50%, transparent ${Math.max(2,inner*0.4)}%, rgba(0,0,0,${0.65+vig*0.32}) ${inner+softness}%)`;
    }

    // hemianopia half-field (5번: 반은 완전히 안 보여야 하므로 세기와 무관하게 거의 완전 불투명)
    // 세부 옵션(오른쪽이 안 보임/왼쪽이 안 보임)에 따라 까맣게 가려지는 쪽이 바뀐다.
    const hemi = res.hemi||0;
    ovHemi.style.opacity = hemi>0 ? 0.99 : 0;
    if(res.hemiSide==='left'){ ovHemi.style.left = 0; ovHemi.style.right = 'auto'; }
    else { ovHemi.style.right = 0; ovHemi.style.left = 'auto'; }
    ovHemi.style.width = hemi>0 ? '50%' : '0';

    // central scotoma (3번: 초기엔 부드러운 그라데이션, 말기로 갈수록 코어가 넓어지고 경계가 또렷해짐 / 항상 정원 유지)
    // 2번: 손가락으로 눌러서 암점을 원하는 위치로 옮겨볼 수 있음
    const central = res.central||0;
    ovCentral.style.opacity = central>0 ? Math.min(0.97, 0.24+central*0.7) : 0;
    ovCentral.style.width = (28+central*28)+'%';
    ovCentral.style.left = (amdFocus.x*100)+'%';
    ovCentral.style.top = (amdFocus.y*100)+'%';
    if(central>0){
      const coreStop = 34 + central*18;   // 34~52 : 항상 edgeStop보다 작게 유지
      const edgeStop = 92 - central*30;   // 92~62 : 말기로 갈수록 경계가 좁고 또렷해짐
      ovCentral.style.background = `radial-gradient(circle, rgba(8,8,6,${0.92+central*0.06}) ${coreStop}%, rgba(8,8,6,${0.5+central*0.3}) ${(coreStop+edgeStop)/2}%, rgba(8,8,6,0) ${edgeStop}%)`;
      ovCentral.style.filter = `blur(${(1-central)*8+1}px)`;
    }

    // 녹내장 - 코 쪽과 위·아래부터 불규칙하게 지워지고 중심은 끝까지 또렷하게 (모양은 vision-fx.js)
    const gloss = res.glaucomaLoss||0;
    ovGlaucoma.style.opacity = gloss>0 ? 1 : 0;
    if(gloss>0) ovGlaucoma.style.background = VisionFx.glaucomaBackground(gloss);

    // haze
    const haze = res.haze||0;
    ovHaze.style.opacity = haze>0 ? Math.min(1, 0.26+haze*0.72) : 0;
    ovHaze.style.backdropFilter = `blur(${res.hazeBlur!=null ? res.hazeBlur : 4+haze*14}px)`;
    ovHaze.style.webkitBackdropFilter = ovHaze.style.backdropFilter;
    ovHaze.style.background = res.hazeColor || '';

    // bloom (백내장 빛번짐) - 밝은 영역만 남긴 뒤 크게 흐려서 원본 위에 screen으로 더한다
    const bloom = res.bloom||0;
    if(bloom>0){
      // grayscale로 밝기(휘도) 기준으로만 걸러서, 색이 진한 물체가 아니라 실제로 밝은 빛만 번지게 한다
      // 광각장애(bloomWhite)는 노란기 없이 하얗게, 문턱을 낮춰 더 넓은 밝은 곳이 더 크게 번진다
      videoBloom.style.filter = res.bloomWhite
        ? `grayscale(100%) brightness(${78-4*bloom}%) contrast(${500+300*bloom}%) blur(${16+30*bloom}px) brightness(${240+180*bloom}%)`
        : `grayscale(100%) brightness(${68-6*bloom}%) contrast(${500+300*bloom}%) blur(${12+26*bloom}px) brightness(${200+160*bloom}%) sepia(80%) saturate(220%)`;
      videoBloom.style.opacity = Math.min(1, (res.bloomWhite ? 0.6 : 0.45)+bloom*(res.bloomWhite ? 0.4 : 0.55));
    } else {
      videoBloom.style.opacity = 0;
    }

    // glare
    const glare = res.glare||0;
    ovGlare.style.opacity = glare>0 ? Math.min(0.85, glare*0.9) : 0;

    // ghost (diplopia) / 노안: 상이 맺히지 않아 여러 겹으로 어긋나 겹친 상
    const ghost = res.ghost||0;
    const defocus = res.defocus && !presbyopiaLoupeOn; // 돋보기 원 안은 선명해야 하므로 겹친 상을 끈다
    videoGhost2.style.opacity = 0;
    if(ghost>0){
      videoGhost.style.mixBlendMode = 'screen';
      videoGhost.style.filter = 'none';
      videoGhost.style.opacity = Math.min(0.65, 0.15+ghost*0.6);
      videoGhost.style.transform = `translate(${4+ghost*22}px, ${2+ghost*8}px)`;
    } else if(defocus){
      // 서로 다른 방향으로 어긋난 상 두 개를 반투명하게 겹친다(뿌연 안개가 아니라 겹친 획)
      [[4,3,0.5],[-4,-2,0.4]].forEach(([dx,dy,a],i)=>{
        const v = i ? videoGhost2 : videoGhost;
        v.style.mixBlendMode = 'normal';
        v.style.filter = res.filter;
        v.style.opacity = a;
        v.style.transform = `scale(${presbyScale()}) translate(${dx}px, ${dy}px)`;
      });
    } else {
      videoGhost.style.opacity = 0;
    }

    // 황반변성 변시증 - 암점 주변의 글자·선이 휘어 보이도록 캔버스에서 픽셀을 옮겨 그린다
    if(res.warp){ amdWarpT = res.warp; amdCanvas.style.filter = res.filter || 'none'; startAmdCanvas(); }
    else stopAmdCanvas();

    // 6번: 색각장애(적록색맹) - 캔버스에 프레임을 그려 픽셀 단위로 색상 매트릭스를 적용
    // (video 태그에 대한 SVG filter:url()은 Safari에서 렌더링되지 않아 캔버스 방식으로 전환)
    if(res.colorblind){
      startColorblindCanvas(res.colorblind);
    } else {
      stopColorblindCanvas();
    }

    // floaters (비문증 실/날파리 + 당뇨망막병증 실 부유물 겸용) - 6번: 세기가 오를수록 각기 다른 위치의 개체가 순차적으로 늘어남
    const fTotal = res.floaters||0;
    [...ovFloaters.children].forEach((el)=>{
      const at = +el.dataset.at;
      if(fTotal>at){
        const grow = Math.min(1, (fTotal-at)/0.28);
        // 말기로 갈수록 개수뿐 아니라 진하기도 올라간다
        const dark = Math.max(0, Math.min(1, (fTotal-0.6)/0.5));
        el.style.opacity = Math.min(0.98, 0.45+grow*0.5+dark*0.1);
        el.style.filter = dark>0 ? `brightness(${1-0.55*dark}) contrast(${1+0.4*dark})` : '';
        const baseW = +el.dataset.w, baseH = +el.dataset.h;
        el.style.width = (baseW*(1+grow*0.5+dark*0.3))+'%';
        el.style.height = (baseH*(1+grow*0.5+dark*0.3))+'%';
      } else {
        el.style.opacity = 0;
      }
    });

    // 5번: 당뇨망막병증 단계별 반점 (초기 소수 → 중기 증가 → 말기로 갈수록 더 진하고 붉게)
    const dTotal = res.diabeticSpots||0;
    [...ovDiabetic.children].forEach(el=>{
      const at = +el.dataset.at;
      if(dTotal>at){
        const growIn = Math.min(1, (dTotal-at)/0.22);
        const isRed = el.classList.contains('red');
        const deepen = 0.55 + dTotal*0.6; // 말기로 갈수록 기존 반점도 계속 진해짐
        el.style.opacity = Math.min(0.97, (isRed ? 0.7 : 0.55) * growIn * deepen);
        // 말기에는 기존 얼룩도 한층 더 커진다
        const late = Math.max(0, Math.min(1, (dTotal-0.6)/0.4));
        const baseW = +el.dataset.w, baseH = +el.dataset.h;
        el.style.width = (baseW*(1+growIn*0.7)*(1+late*0.6))+'%';
        el.style.height = (baseH*(1+growIn*0.7)*(1+late*0.6))+'%';
      } else {
        el.style.opacity = 0;
      }
    });

    // 조건별 조작법 안내 (개조식으로 간결하게)
    if(currentCond.id==='presbyopia'){
      hintEl.textContent = presbyopiaLoupeOn
        ? '🔍 누른 채 움직이면 동그라미 안만 잘 보여요'
        : (presbyopiaNear ? '📖 가까운 글씨는 초점이 안 맞아 읽기 힘들어요' : '🏞 먼 곳은 또렷하게 잘 보여요');
    } else if(currentCond.id==='amd'){
      hintEl.textContent = '👆 화면 터치 · 암점 위치 이동 · 주변 글자·선이 휘어 보여요';
    } else if(currentCond.id==='accommodative'){
      hintEl.textContent = '🔄 자동 초점 흐림↔선명 반복';
    } else if(currentCond.id==='hemianopia'){
      hintEl.textContent = '👆 화면을 누른 쪽이 보이고, 반대쪽이 까맣게 가려져요';
    } else {
      hintEl.textContent = '✋ 손잡이 좌우 드래그 · 1(정상)·2(체험) 비교';
    }

    compactInfo.textContent = currentCond.id==='presbyopia'
      ? `${currentCond.name} · ${presbyopiaNear ? '가까운 글씨 보기' : '먼 거리 보기'}`
      : `${currentCond.name} · ${sevText(severity)} ${severity}%`;

    tipsToggleLabel.textContent = currentCond.group==='aging'
      ? '💡 어르신은 이렇게 어려워요'
      : '💡 이런 증상이 있는 분, 이렇게 어려워해요';
    tipsDesc.textContent = currentCond.desc;
    tipsList.innerHTML = currentCond.tips.map(x=>`<li>${x}</li>`).join('');
  }

  tipsToggle.addEventListener('click', ()=>{
    const open = tipsBody.classList.toggle('open');
    tipsToggle.classList.toggle('open', open);
    panelState = open ? 'up' : 'mid';
  });

  loupeToggle.addEventListener('click', ()=>{
    if(currentCond.id!=='presbyopia') return;
    presbyopiaLoupeOn = !presbyopiaLoupeOn;
    loupeToggle.classList.toggle('on', presbyopiaLoupeOn);
    if(presbyopiaLoupeOn) startLoupeCanvas(); else stopLoupeCanvas();
    render();
  });

  // 2번: 손끝으로 드래그하면 위(팁 열림)·중간(기본)·아래(컴팩트, 카메라 확대) 3단계로 이동
  // 한 번의 드래그 제스처당 한 단계만 이동하도록 stepTaken 플래그로 제한 (여러 단계가 한 번에 건너뛰는 문제 방지)
  const panelDrag = document.getElementById('panelDrag');
  let panelState = 'mid'; // 'up' | 'mid' | 'down'
  function applyPanelState(){
    panelEl.classList.toggle('compact', panelState==='down');
    const openTips = panelState==='up';
    tipsBody.classList.toggle('open', openTips);
    tipsToggle.classList.toggle('open', openTips);
  }
  (function(){
    let startY = 0, startX = 0, moved = false, active = false, stepTaken = false;
    const TH = 30;
    function down(e){
      active = true; moved = false; stepTaken = false;
      startY = e.clientY; startX = e.clientX;
      try{ panelDrag.setPointerCapture(e.pointerId); }catch(err){}
    }
    function move(e){
      if(!active || stepTaken) return;
      const dy = e.clientY - startY, dx = e.clientX - startX;
      if(Math.abs(dy) > 8 || Math.abs(dx) > 8) moved = true;
      if(!moved) return;
      if(dy < -TH && panelState !== 'up'){
        panelState = panelState === 'down' ? 'mid' : 'up';
        applyPanelState(); stepTaken = true;
      } else if(dy > TH && panelState !== 'down'){
        panelState = panelState === 'up' ? 'mid' : 'down';
        applyPanelState(); stepTaken = true;
      }
    }
    function up(){
      if(active && !moved){
        panelState = panelState === 'up' ? 'mid' : (panelState === 'down' ? 'mid' : 'down');
        applyPanelState();
      }
      active = false;
    }
    panelDrag.addEventListener('pointerdown', down);
    panelDrag.addEventListener('pointermove', move);
    panelDrag.addEventListener('pointerup', up);
    panelDrag.addEventListener('pointercancel', ()=>{ active = false; });
  })();

  // 7번: 조절장애 - 자동으로 몇 초마다 한 번씩 흐려졌다 맞춰지는 초점 전환(포커스랙) 사이클
  let focusLagTimer = null;
  function triggerFocusLag(){
    if(currentCond.id!=='accommodative') return;
    const t = severity/100;
    videoSim.style.transition = 'filter .35s ease-in';
    videoSim.style.filter = `blur(${6+6*t}px) contrast(${100-8*t}%)`;
    setTimeout(()=>{
      if(currentCond.id!=='accommodative') return;
      videoSim.style.transition = 'filter 1.3s cubic-bezier(.2,.7,.3,1)';
      videoSim.style.filter = `blur(0.3px) contrast(100%)`;
    }, 450);
  }
  function startFocusLagCycle(){
    if(focusLagTimer) return;
    triggerFocusLag();
    focusLagTimer = setInterval(triggerFocusLag, 3800);
  }
  function stopFocusLagCycle(){
    if(focusLagTimer){ clearInterval(focusLagTimer); focusLagTimer = null; }
    videoSim.style.transition = '';
  }

  // 반맹 - 일상생활 체험과 같이, 화면을 누른 쪽이 보이는 쪽이 되고 반대쪽이 까맣게 가려진다
  document.getElementById('stage').addEventListener('pointerdown', e=>{
    if(currentCond.id!=='hemianopia') return;
    if(e.target.closest && e.target.closest('a,button')) return;
    const r = e.currentTarget.getBoundingClientRect();
    currentSub = (e.clientX - r.left) < r.width/2 ? 'right' : 'left';
    [...subChipsEl.children].forEach((x,i)=> x.classList.toggle('active', currentCond.sub[i]===currentSub));
    render();
  });

  // 2번: 황반변성 - 손가락으로 눌러서 암점 위치를 옮겨보기
  (function(){
    let dragging = false;
    function stageElAmd(){ return document.getElementById('stage'); }
    function toFrac(e){
      const r = stageElAmd().getBoundingClientRect();
      return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
    }
    function setFocus(e){
      const f = toFrac(e);
      amdFocus.x = Math.max(0.12, Math.min(0.88, f.x));
      amdFocus.y = Math.max(0.12, Math.min(0.88, f.y));
      render();
    }
    function start(e){
      if(currentCond.id!=='amd') return;
      if(e.target.closest && e.target.closest('#divider')) return;
      dragging = true; setFocus(e);
    }
    function move(e){ if(dragging && currentCond.id==='amd') setFocus(e); }
    function end(){ dragging = false; }
    const st = stageElAmd();
    st.addEventListener('pointerdown', start);
    st.addEventListener('pointermove', e=>{ if(e.buttons) move(e); });
    st.addEventListener('pointerup', end);
    st.addEventListener('pointercancel', end);
  })();

  // 1번-보조: 노안 돋보기 모드 - 손가락으로 누르고 있는 자리를 돋보기 위치로 옮긴다
  (function(){
    let dragging = false;
    function stageElLoupe(){ return document.getElementById('stage'); }
    function toFrac(e){
      const r = stageElLoupe().getBoundingClientRect();
      return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
    }
    function setLoupe(e){
      const f = toFrac(e);
      loupePos.x = Math.max(0.08, Math.min(0.92, f.x));
      loupePos.y = Math.max(0.08, Math.min(0.92, f.y));
    }
    function start(e){
      if(currentCond.id!=='presbyopia' || !presbyopiaLoupeOn) return;
      if(e.target.closest && (e.target.closest('#divider') || e.target.closest('#loupeToggle'))) return;
      dragging = true; setLoupe(e);
    }
    function move(e){ if(dragging && currentCond.id==='presbyopia' && presbyopiaLoupeOn) setLoupe(e); }
    function end(){ dragging = false; }
    const st = stageElLoupe();
    st.addEventListener('pointerdown', start);
    st.addEventListener('pointermove', e=>{ if(e.buttons) move(e); });
    st.addEventListener('pointerup', end);
    st.addEventListener('pointercancel', end);
  })();

  const stage = document.getElementById('stage');
  const divider = document.getElementById('divider');
  const simWrap = document.getElementById('simWrap');
  let dragging = false;
  function setSplit(px){
    const rect = stage.getBoundingClientRect();
    let x = Math.max(rect.width*0.08, Math.min(rect.width*0.92, px));
    const pct = (x/rect.width)*100;
    divider.style.left = x+'px';
    simWrap.style.clipPath = `polygon(${pct}% 0, 100% 0, 100% 100%, ${pct}% 100%)`;
  }
  setSplit((stage.getBoundingClientRect().width||360)/2);
  function pointerDown(){ dragging = true; }
  function pointerMove(e){
    if(!dragging) return;
    const rect = stage.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    setSplit(clientX - rect.left);
  }
  function pointerUp(){ dragging = false; }
  divider.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('resize', ()=> setSplit((stage.getBoundingClientRect().width)/2));

  const permOverlay = document.getElementById('permOverlay');
  const btnStart = document.getElementById('btnStart');
  const permErr = document.getElementById('permErr');
  async function startCamera(){
    permErr.textContent='';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      permErr.textContent = '이 브라우저는 카메라 접근을 지원하지 않아요. https 환경에서 열어주세요.';
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ideal:1280}, height:{ideal:720} }, audio:false
      });
      videoNormal.srcObject = stream;
      videoSim.srcObject = stream;
      videoGhost.srcObject = stream;
      videoGhost2.srcObject = stream;
      videoBloom.srcObject = stream;
      permOverlay.style.display='none';
      render();
    }catch(err){
      permErr.textContent = '카메라 접근이 거부되었어요. 브라우저 설정에서 카메라 권한을 허용한 뒤 다시 시도해주세요.';
    }
  }
  btnStart.addEventListener('click', startCamera);

  render();
})();
</script>
</body>
</html>
